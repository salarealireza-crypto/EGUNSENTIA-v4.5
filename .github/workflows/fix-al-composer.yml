name: Repair AL composer after failed turn

on:
  workflow_run:
    workflows:
      - Import Egunsentia CP23 source
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == 'salarealireza-crypto/EGUNSENTIA-v4.5'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply fail-safe AL composer recovery
        run: python .github/scripts/fix-al-composer.py

      - name: Commit the focused repair
        run: |
          if git diff --quiet -- src/lib/game/play.ts; then
            echo "No AL composer change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/game/play.ts
          git commit -m "Fix AL composer lock after failed turns"
          git push origin HEAD:main
