
name: Import Egunsentia CP23 source

on:
  push:
    paths:
      - 'EGUNSENTIA-STAGE47-CP23-ROUND6-PART2-FOLLOWUP-RECHECK4-PARTIAL-2026-11-10.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          archive = Path("EGUNSENTIA-STAGE47-CP23-ROUND6-PART2-FOLLOWUP-RECHECK4-PARTIAL-2026-11-10.zip")
          if not archive.is_file():
              raise SystemExit("Source ZIP not found")

          written = 0
          skipped = 0

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError(f"ZIP integrity failure: {bad}")

              for info in z.infolist():
                  rel = PurePosixPath(info.filename)

                  if rel.is_absolute() or ".." in rel.parts:
                      raise RuntimeError(f"Unsafe path: {info.filename}")

                  if info.is_dir():
                      continue

                  excluded = {
                      ".git", "node_modules", ".vercel",
                      "dist", "build", "coverage", ".turbo", ".cache"
                  }

                  if any(part in excluded for part in rel.parts):
                      skipped += 1
                      continue

                  if rel.name.lower().startswith(".env") and rel.as_posix() != ".env.example":
                      skipped += 1
                      continue

                  if stat.S_ISLNK(info.external_attr >> 16):
                      skipped += 1
                      continue

                  target = Path(*rel.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
                  written += 1

          archive.unlink()
          print(f"Imported {written} files; skipped {skipped}.")
          PY

      - name: Commit source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Import Egunsentia CP23 source"
          git push origin HEAD:main
          
